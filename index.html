<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cyber Drive X - Synthwave Edition</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #050510;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none; 
    touch-action: none; 
}

canvas {
    display: block;
}

/* =========================
   HUD
========================= */

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    text-shadow: 2px 2px 5px rgba(0,0,0,.9);
    pointer-events: none;
    z-index: 10;
}

#score-container {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
}

#score {
    font-size: 42px;
    font-weight: 900;
    color: #00ffff;
    text-shadow: 0 0 15px #00ffff, 2px 2px 5px #000;
}

#highscore {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    opacity: .85;
}

#distance {
    font-size: 16px;
    margin-top: 3px;
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff;
}

#multiplier {
    display: none;
    color: #ff00ff;
    font-size: 24px;
    font-weight: 900;
    margin-top: 8px;
    text-shadow: 0 0 15px #ff00ff;
    animation: pulse .5s infinite alternate;
}

#nearMiss {
    position: absolute;
    top: 34%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #00ffff;
    font-size: 32px;
    font-weight: 900;
    text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff, 2px 2px 4px #000;
    opacity: 0;
    pointer-events: none;
    z-index: 15;
}

#combo {
    color: #ff9d00;
    font-size: 22px;
    font-weight: 900;
    margin-top: 4px;
    text-shadow: 0 0 10px #ff9d00;
    transition: transform 0.1s;
}

#instructions {
    font-size: 14px;
    background: rgba(5, 5, 20, 0.7);
    padding: 15px;
    border-radius: 10px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(0, 255, 255, 0.4);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    line-height: 1.6;
    margin-top: 10px;
}

#instructions b { color: #ff00ff; text-shadow: 0 0 5px #ff00ff; }

/* =========================
   SPEEDOMETER & NITRO
========================= */

#speedometer {
    position: absolute;
    bottom: 30px;
    right: 30px;
    color: #00ffff;
    text-align: right;
    text-shadow: 0 0 15px rgba(0,255,255,.9), 2px 2px 4px rgba(0,0,0,.9);
    font-family: monospace;
    pointer-events: none;
    z-index: 10;
}

#speed-val {
    font-size: 72px;
    font-weight: 900;
    line-height: .8;
}

#speed-unit {
    font-size: 24px;
    font-weight: bold;
    color: white;
    opacity: .8;
}

#nitro-container {
    position: absolute;
    bottom: 30px;
    left: 30px;
    width: 260px;
    z-index: 10;
    pointer-events: none;
    color: white;
    text-shadow: 2px 2px 4px #000;
}

#nitro-label {
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 5px;
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff;
}

#nitro-bar-bg {
    width: 100%;
    height: 18px;
    background: rgba(0,0,0,.8);
    border: 2px solid rgba(0,255,255,.5);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0,255,255,0.3);
}

#nitro-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ff00ff, #00ffff);
    box-shadow: 0 0 20px #00ffff;
    transition: width .1s linear;
}

/* =========================
   MOBILE CONTROLS (Ergonomic)
========================= */
#mobile-controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: none; 
    justify-content: space-between;
    padding: 0 15px;
    z-index: 50;
    pointer-events: none;
    align-items: flex-end;
}

.mob-btn {
    pointer-events: auto;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: rgba(10, 10, 30, 0.6);
    border: 2px solid rgba(0, 255, 255, 0.6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 30px;
    backdrop-filter: blur(5px);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    text-shadow: 0 0 5px #00ffff;
}

.mob-btn:active {
    background: rgba(0, 255, 255, 0.5);
    transform: scale(0.92);
}

.mob-pedal {
    border-radius: 15px;
    font-size: 16px;
    text-transform: uppercase;
}

@media (max-width: 900px) {
    #mobile-controls { display: flex; }
    #instructions { display: none; }
    #speedometer { bottom: 180px; right: 15px; }
    #nitro-container { bottom: 180px; left: 15px; width: 160px; }
    #speed-val { font-size: 52px; }
    #ui { top: 10px; left: 10px; }
    #score { font-size: 32px; }
}

/* =========================
   EFFECTS & GAME OVER
========================= */
#crash-flash {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #ff0000;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    transition: opacity 0.1s ease-out;
}

#gameover {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(5,0,10,.95);
    padding: 40px 60px;
    border-radius: 18px;
    border: 3px solid #ff00ff;
    color: #ff00ff;
    font-size: 52px;
    font-weight: 900;
    text-shadow: 0 0 20px #ff00ff;
    display: none;
    text-align: center;
    backdrop-filter: blur(15px);
    z-index: 60;
    box-shadow: 0 0 40px rgba(255,0,255,0.4);
}

#gameover-score {
    color: white;
    font-size: 24px;
    margin-top: 15px;
    text-shadow: none;
    line-height: 1.6;
}

.restart-btn {
    margin-top: 30px;
    padding: 15px 40px;
    font-size: 22px;
    font-weight: bold;
    background: linear-gradient(45deg, #ff00ff, #00ffff);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    pointer-events: auto;
    transition: .2s;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,255,255,0.4);
}

.restart-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(255,0,255,0.6);
}

@keyframes pulse {
    from { transform: scale(1); text-shadow: 0 0 10px #ff00ff; }
    to { transform: scale(1.1); text-shadow: 0 0 25px #00ffff; }
}

@keyframes nearMissAnimation {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
}

.score-bump { animation: scoreBump .3s ease; }
.combo-bump { animation: comboBump .3s ease; }

@keyframes scoreBump {
    0% { transform: scale(1); color:#00ffff; }
    50% { transform: scale(1.3); color:#fff; text-shadow: 0 0 20px #fff;}
    100% { transform: scale(1); color:#00ffff;}
}

@keyframes comboBump {
    0% { transform: scale(1); color: #ff9d00;}
    50% { transform: scale(1.4); color: #ffffff; text-shadow: 0 0 20px #fff;}
    100% { transform: scale(1); color: #ff9d00;}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<div id="crash-flash"></div>

<!-- =========================
     HUD
========================= -->
<div id="ui">
    <div id="score-container">
        <div id="score">Skor: 0</div>
        <div id="highscore">En Yüksek: 0</div>
        <div id="distance">Mesafe: 0.0 km</div>
        <div id="combo">Combo: x1.0</div>
        <div id="multiplier">🔥 IŞIK HIZI!</div>
    </div>
    <div id="instructions">
        <b>SYNTHWAVE KONTROLLERİ</b><br>
        ⬅️ / A : Sola Kır<br>
        ➡️ / D : Sağa Kır<br>
        ⬆️ / W : Gaz Ver<br>
        ⬇️ / S : Fren<br>
        🚀 SPACE : Nitro<br>
        📷 V : Kamera Değiştir
    </div>
</div>

<div id="speedometer">
    <div id="speed-val">0</div>
    <div id="speed-unit">KM/H</div>
</div>

<div id="nitro-container">
    <div id="nitro-label">🚀 NİTRO</div>
    <div id="nitro-bar-bg">
        <div id="nitro-bar"></div>
    </div>
</div>

<div id="nearMiss">YAKIN GEÇİŞ +50</div>

<!-- =========================
     MOBILE CONTROLS
========================= -->
<div id="mobile-controls">
    <!-- Sol Taraftaki Yön Tuşları -->
    <div style="display:flex; gap: 12px; padding-bottom: 10px;">
        <div id="btn-left" class="mob-btn">◀</div>
        <div id="btn-right" class="mob-btn">▶</div>
    </div>
    
    <!-- Sağ Taraftaki Pedallar -->
    <div style="display:flex; flex-direction:column; gap: 12px; align-items:flex-end;">
        <div id="btn-nitro" class="mob-btn mob-pedal" style="width: 100px; height: 50px; border-color: #ff00ff; color:#ff00ff; text-shadow:0 0 5px #ff00ff; font-size:18px;">NİTRO</div>
        <div style="display:flex; gap: 12px;">
            <div id="btn-brake" class="mob-btn mob-pedal" style="width: 75px; height: 75px; border-color: #ff0055; color:#ff0055; text-shadow:0 0 5px #ff0055;">FREN</div>
            <div id="btn-gas" class="mob-btn mob-pedal" style="width: 85px; height: 85px; border-color: #00ff00; color:#00ff00; text-shadow:0 0 5px #00ff00;">GAZ</div>
        </div>
    </div>
</div>

<!-- =========================
     GAME OVER
========================= -->
<div id="gameover">
    SİSTEM ÇÖKTÜ!
    <div id="gameover-score"></div>
    <button class="restart-btn" onclick="location.reload()">Sistemi Yeniden Başlat</button>
</div>

<script>
/* =========================================================
   HIGH SCORE
========================================================= */
let bestScore = Number(localStorage.getItem("endlessHighScore") || 0);
document.getElementById("highscore").innerText = "En Yüksek: " + bestScore;

/* =========================================================
   THREE.JS & SYNTHWAVE ATMOSPHERE
========================================================= */
const scene = new THREE.Scene();

const skyColor = new THREE.Color(0x0a0515); 
const fogColor = new THREE.Color(0x1a0530); 

scene.background = skyColor;
scene.fog = new THREE.FogExp2(fogColor, 0.0035);

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, .1, 700);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING & SYNTHWAVE SUN 
========================================================= */
const ambientLight = new THREE.AmbientLight(0x5500aa, 1.2); // Parlaklık artırıldı
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xff00ff, 1.2); 
sun.position.set(-50, 80, -120);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = .5;
sun.shadow.camera.far = 400;
sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150;
sun.shadow.camera.bottom = -150;
scene.add(sun);

const bgSunGeo = new THREE.CircleGeometry(160, 64);
const bgSunMat = new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.95, fog: false });
const bgSun = new THREE.Mesh(bgSunGeo, bgSunMat);
bgSun.position.set(0, 60, -500);
scene.add(bgSun);

for(let i=0; i<9; i++) {
    let stripe = new THREE.Mesh(new THREE.PlaneGeometry(400, 4 + i*0.8), new THREE.MeshBasicMaterial({color: skyColor, fog: false}));
    stripe.position.set(0, -20 + i * 14, -499); 
    scene.add(stripe);
}

/* =========================================================
   ROAD & ENVIRONMENT
========================================================= */
const roadWidth = 28;
const laneCount = 7;
const laneWidth = roadWidth / laneCount;
const lanes = [];
for (let i = 0; i < laneCount; i++) {
    lanes.push(-roadWidth / 2 + laneWidth / 2 + i * laneWidth);
}

const grassGeo = new THREE.PlaneGeometry(600, 800); 
const grassMat = new THREE.MeshStandardMaterial({ color: 0x050210, roughness: 1.0 }); 
const grass = new THREE.Mesh(grassGeo, grassMat);
grass.rotation.x = -Math.PI / 2;
grass.receiveShadow = true;
scene.add(grass);

const roadGeo = new THREE.PlaneGeometry(roadWidth, 800);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.6 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.y = .01;
road.receiveShadow = true;
scene.add(road);

const leftEdge = new THREE.Mesh(new THREE.PlaneGeometry(.3, 800), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
leftEdge.rotation.x = -Math.PI / 2;
leftEdge.position.set(-roadWidth / 2, .025, 0);
scene.add(leftEdge);

const rightEdge = new THREE.Mesh(new THREE.PlaneGeometry(.3, 800), new THREE.MeshBasicMaterial({ color: 0xff00ff }));
rightEdge.rotation.x = -Math.PI / 2;
rightEdge.position.set(roadWidth / 2, .025, 0);
scene.add(rightEdge);

const lines = [];
const lineGeo = new THREE.PlaneGeometry(.18, 6);
const lineMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 

for (let lane = 1; lane < laneCount; lane++) {
    const x = -roadWidth / 2 + laneWidth * lane;
    for (let i = 0; i < 60; i++) {
        const line = new THREE.Mesh(lineGeo, lineMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(x, .026, -i * 12);
        scene.add(line);
        lines.push(line);
    }
}

/* =========================================================
   CYBER MOUNTAINS, TREES & HOUSES
========================================================= */
function createMountain(x, z, scale) {
    const group = new THREE.Group();
    const geo = new THREE.ConeGeometry(25, 60, 6); 
    const mat = new THREE.MeshStandardMaterial({ color: 0x110033, roughness: 0.9, flatShading: true });
    const mountain = new THREE.Mesh(geo, mat);
    
    const wireGeo = new THREE.EdgesGeometry(geo);
    const wireMat = new THREE.LineBasicMaterial({ color: 0xff00ff, linewidth: 2 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    mountain.add(wireframe);

    group.add(mountain);
    group.position.set(x, 29, z);
    group.scale.set(scale, scale, scale);
    scene.add(group);
}
for (let i = 0; i < 24; i++) {
    createMountain( (Math.random() > .5 ? 1 : -1) * (60 + Math.random() * 120), -Math.random() * 450, .7 + Math.random() * 1.5 );
}

const trees = [];
function createTree() {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.3, .5, 4, 6), new THREE.MeshStandardMaterial({ color: 0x111111 }));
    trunk.position.y = 2;
    group.add(trunk);
    const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 8, 6), new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true }));
    leaves.position.y = 6;
    group.add(leaves);
    return group;
}
function spawnTree(z = -300) {
    const tree = createTree();
    const side = Math.random() > .5 ? 1 : -1;
    tree.position.set(side * (roadWidth / 2 + 5 + Math.random() * 40), 0, z);
    const scale = .8 + Math.random() * 1.2;
    tree.scale.set(scale, scale, scale);
    scene.add(tree);
    trees.push(tree);
}
for (let z = -350; z < 50; z += 12) if (Math.random() > .2) spawnTree(z);

const houses = [];
function createHouse() {
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(10, 7, 12), new THREE.MeshStandardMaterial({ color: 0x222233 }));
    body.position.y = 3.5; group.add(body);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(9, 5, 4), new THREE.MeshStandardMaterial({ color: 0x110022 }));
    roof.position.y = 9.5; roof.rotation.y = Math.PI / 4; group.add(roof);
    const win1 = new THREE.Mesh(new THREE.BoxGeometry(2,2,0.1), new THREE.MeshBasicMaterial({color:0x00ffff}));
    win1.position.set(0, 4, 6.05); group.add(win1);
    return group;
}
function spawnHouse(z = -400) {
    const house = createHouse();
    const side = Math.random() > 0.5 ? 1 : -1;
    house.position.set(side * (roadWidth / 2 + 35 + Math.random() * 40), 0, z);
    house.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
    scene.add(house);
    houses.push(house);
}
for(let z = -400; z < 50; z += 180) if(Math.random() > 0.3) spawnHouse(z);

/* =========================================================
   WARP SPEED LINES
========================================================= */
const warpLines = new THREE.Group();
const warpMat = new THREE.MeshBasicMaterial({color: 0xff00ff, transparent: true, opacity: 0.8});
const warpGeo = new THREE.BoxGeometry(0.1, 0.1, 15);
for(let i=0; i<100; i++) {
    let m = new THREE.Mesh(warpGeo, warpMat);
    m.position.set((Math.random()-0.5)*100, 2+Math.random()*20, -Math.random()*500);
    warpLines.add(m);
}
scene.add(warpLines);

/* =========================================================
   SPEED PARTICLES
========================================================= */
const particleCount = 300;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
for (let i = 0; i < particleCount * 3; i += 3) {
    particlePositions[i] = (Math.random() - .5) * 60;
    particlePositions[i + 1] = Math.random() * 10;
    particlePositions[i + 2] = -Math.random() * 400;
}
particleGeo.setAttribute("position", new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({ color: 0x00ffff, size: .15, transparent: true, opacity: .7 });
const speedParticles = new THREE.Points(particleGeo, particleMat);
scene.add(speedParticles);

/* =========================================================
   CAR CREATOR (GÜÇLÜ VE PARLAK RENKLER EKLENDİ)
========================================================= */
let playerTaillightMat;
let playerExhausts = [];
let steeringWheel;
let playerFrontWheels = [];
let playerHeadlights = [];

function createCar(colorStr, isPlayer = false) {
    const carGroup = new THREE.Group();
    
    // YENİ: Trafik araçları artık kendi renklerinde hafifçe parlar (Emissive)
    let emissiveColor = isPlayer ? 0x000000 : colorStr;
    let emissiveIntensity = isPlayer ? 0 : 0.4;

    const carMat = new THREE.MeshStandardMaterial({ 
        color: colorStr, 
        metalness: 0.7, 
        roughness: 0.2,
        emissive: emissiveColor,
        emissiveIntensity: emissiveIntensity
    });
    
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 });
    const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });

    const chassisGeo = new THREE.BoxGeometry(2.25, .32, 4.5);
    const chassis = new THREE.Mesh(chassisGeo, blackMat);
    chassis.position.y = .35; chassis.castShadow = true; carGroup.add(chassis);

    const bodyGeo = new THREE.BoxGeometry(2.05, .32, 4.2);
    const body = new THREE.Mesh(bodyGeo, carMat);
    body.position.y = .62; body.castShadow = true; carGroup.add(body);

    const hoodGeo = new THREE.BoxGeometry(1.9, .22, 1.35);
    const hood = new THREE.Mesh(hoodGeo, carMat);
    hood.position.set(0, .75, -1.55); hood.rotation.x = Math.PI / 14; carGroup.add(hood);

    const cabinGroup = new THREE.Group();
    const cabinGeo = new THREE.BoxGeometry(1.48, .45, 1.65);
    const cabin = new THREE.Mesh(cabinGeo, glassMat);
    cabin.position.set(0, 1, .15); cabinGroup.add(cabin);

    const windshieldGeo = new THREE.BoxGeometry(1.38, .5, .08);
    const windshield = new THREE.Mesh(windshieldGeo, glassMat);
    windshield.position.set(0, 1, -.7); windshield.rotation.x = -Math.PI / 6; cabinGroup.add(windshield);

    const rearGlass = new THREE.Mesh(windshieldGeo, glassMat);
    rearGlass.position.set(0, 1, 1); rearGlass.rotation.x = Math.PI / 6; cabinGroup.add(rearGlass);

    carGroup.add(cabinGroup);
    if (isPlayer) carGroup.userData.cabin = cabinGroup;

    const neonMat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0x00ffff : 0xff00ff });
    const neon = new THREE.Mesh(new THREE.BoxGeometry(2.12, .055, 3.8), neonMat);
    neon.position.y = .47; carGroup.add(neon);

    const headlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const headlights = new THREE.Mesh(new THREE.BoxGeometry(1.7, .09, .12), headlightMat);
    headlights.position.set(0, .7, -2.2); carGroup.add(headlights);

    if (isPlayer) {
        const pLight1 = new THREE.SpotLight(0xffffff, 0, 300, Math.PI/4, 0.8, 1);
        pLight1.position.set(-0.7, 1, -2.2); pLight1.target.position.set(-0.7, 0, -60);
        carGroup.add(pLight1); carGroup.add(pLight1.target);

        const pLight2 = new THREE.SpotLight(0xffffff, 0, 300, Math.PI/4, 0.8, 1);
        pLight2.position.set(0.7, 1, -2.2); pLight2.target.position.set(0.7, 0, -60);
        carGroup.add(pLight2); carGroup.add(pLight2.target);

        playerHeadlights.push(pLight1, pLight2);
    }

    const taillightMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0x550000, emissiveIntensity: 1 });
    if (isPlayer) playerTaillightMat = taillightMat;
    const taillight = new THREE.Mesh(new THREE.BoxGeometry(1.7, .09, .12), taillightMat);
    taillight.position.set(0, .68, 2.15); carGroup.add(taillight);

    if (isPlayer) {
        const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.9, .06, .4), carMat);
        spoiler.position.set(0, 1, 1.85); carGroup.add(spoiler);

        const exhaustMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: .9 });
        for (let i = -1; i <= 1; i += 2) {
            const exhaust = new THREE.Mesh(new THREE.ConeGeometry(.16, .85, 8).rotateX(Math.PI / 2), exhaustMat);
            exhaust.position.set(i * .5, .42, 2.35); exhaust.visible = false;
            carGroup.add(exhaust); playerExhausts.push(exhaust);
        }
        steeringWheel = new THREE.Mesh(new THREE.TorusGeometry(.21, .035, 8, 24), new THREE.MeshStandardMaterial({ color: 0x222222 }));
        steeringWheel.position.set(-.4, .85, -.35); steeringWheel.rotation.x = -Math.PI / 8;
        carGroup.add(steeringWheel);
    }

    const tireMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: .95 });
    const rimMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: .9, roughness: .2 });
    const wheelPositions = [ [-1.05, .38, 1.35], [1.05, .38, 1.35], [-1.05, .38, -1.35], [1.05, .38, -1.35] ];

    wheelPositions.forEach((pos, index) => {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.37, .37, .28, 18), tireMat);
        const rim = new THREE.Mesh(new THREE.CylinderGeometry(.21, .21, .3, 10), rimMat);
        wheel.add(rim); wheel.rotation.z = Math.PI / 2; wheel.position.set(...pos); wheel.castShadow = true;
        carGroup.add(wheel);
        if (isPlayer && index < 2) playerFrontWheels.push(wheel);
    });
    
    return carGroup;
}

const playerCar = createCar(0x111111, true); // Simsiyah Oyuncu Aracı
scene.add(playerCar);
let currentLane = 3;
playerCar.position.set(lanes[currentLane], 0, 0);

/* =========================================================
   GAME PHYSICS & VARIABLES (YUMUŞAK HIZLANMA / FREN)
========================================================= */
let currentSpeed = 0.0;  
let maxSpeed = 5.0;      
// YENİ: İvme ve fren güçleri pürüzsüzleştirildi (Daha gerçekçi)
let accelerationRate = .006; 
let brakingPower = .025;  
let friction = .0015;

let steeringVelocity = 0;
let isAccelerating = false;
let isBraking = false;
let isNitro = false;

let nitro = 100;
let score = 0;
let distance = 0;
let combo = 1;
let comboTimer = 0;

let isGameOver = false;
let isFirstPerson = false;
let spawnTimer = 0;
let deerTimer = 0;

/* =========================================================
   COINS
========================================================= */
const coins = [];
const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1.0, roughness: 0.1, emissive: 0x332200 });
const coinGeo = new THREE.CylinderGeometry(.42, .42, .1, 18).rotateX(Math.PI / 2);

function spawnCoin(laneX, z) {
    const coin = new THREE.Mesh(coinGeo, coinMat);
    coin.position.set(laneX, .6, z);
    coin.castShadow = true;
    scene.add(coin);
    coins.push(coin);
}

/* =========================================================
   TRAFFIC (CANLI VE GÖRÜNÜR RENKLER)
========================================================= */
const trafficCars = [];
// YENİ: Karanlıkta patlayan, çok net görünen renkler
const trafficColors = [0xffffff, 0xeeeeee, 0x00ffff, 0xff00ff, 0xffff00, 0x00ffcc];

function getAbsoluteSpeedForLane(laneIndex) {
    if(laneIndex <= 1) return 3.5 + Math.random() * 0.8;       
    else if(laneIndex >= 5) return 1.5 + Math.random() * 0.5;  
    else return 2.5 + Math.random() * 0.8;                     
}

function spawnTrafficCar() {
    if (trafficCars.length > 45) return; // YENİ: Araç limiti 45'e çıkarıldı (Daha Yoğun Trafik)

    const lane = Math.floor(Math.random() * laneCount);
    const initialSpeed = getAbsoluteSpeedForLane(lane);
    
    let spawnZ = 0;
    if (initialSpeed > currentSpeed) {
        spawnZ = 80 + Math.random() * 40; 
    } else {
        spawnZ = -250 - Math.random() * 150;
    }

    const color = trafficColors[Math.floor(Math.random() * trafficColors.length)];
    const car = createCar(color, false);
    
    car.position.set(lanes[lane], 0, spawnZ);
    car.rotation.y = 0; 
    scene.add(car);

    trafficCars.push({
        mesh: car,
        lane: lane,
        absSpeed: initialSpeed,
        targetSpeed: initialSpeed,
        changeTimer: 80 + Math.random() * 200,
        targetLane: lane
    });

    if (Math.random() > .5 && spawnZ < 0) {
        let coinLane = Math.floor(Math.random() * laneCount);
        spawnCoin(lanes[coinLane], spawnZ - 15);
    }
}

/* =========================================================
   CYBER DEER (DAHA SIK)
========================================================= */
const deerList = [];
function createDeer() {
    const deer = new THREE.Group();
    const brownMat = new THREE.MeshStandardMaterial({ color: 0x8b5a32 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x4a2d18 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(1.25, .55, 2.2), brownMat);
    body.position.y = 1.25; deer.add(body);
    const head = new THREE.Mesh(new THREE.BoxGeometry(.55, .55, .7), brownMat);
    head.position.set(0, 1.65, -1.2); deer.add(head);
    const neck = new THREE.Mesh(new THREE.BoxGeometry(.4, .8, .4), brownMat);
    neck.position.set(0, 1.5, -.8); neck.rotation.x = -.35; deer.add(neck);

    const legGeo = new THREE.CylinderGeometry(.09, .1, 1.15, 8);
    const legPositions = [[-.45, .55, -.65], [.45, .55, -.65], [-.45, .55, .65], [.45, .55, .65]];
    legPositions.forEach(position => {
        const leg = new THREE.Mesh(legGeo, darkMat);
        leg.position.set(...position); deer.add(leg);
    });

    for (let side = -1; side <= 1; side += 2) {
        const antler = new THREE.Mesh(new THREE.BoxGeometry(.06, .6, .06), darkMat);
        antler.position.set(side * .2, 2.05, -1.35); deer.add(antler);
    }
    return deer;
}

function spawnDeer() {
    if (deerList.length > 2) return;
    const deer = createDeer();
    const fromLeft = Math.random() > .5;

    deer.position.set( fromLeft ? -roadWidth / 2 - 7 : roadWidth / 2 + 7, 0, -200 - Math.random() * 100 );
    deer.rotation.y = fromLeft ? Math.PI / 2 : -Math.PI / 2;
    scene.add(deer);

    deerList.push({
        mesh: deer,
        direction: fromLeft ? 1 : -1,
        speed: .15 + Math.random() * .1,
        phase: Math.random() * Math.PI
    });
}

/* =========================================================
   SCORE & UI
========================================================= */
function updateScoreDisplay() {
    const scoreEl = document.getElementById("score");
    scoreEl.innerText = "Skor: " + score;
    scoreEl.classList.remove("score-bump");
    void scoreEl.offsetWidth;
    scoreEl.classList.add("score-bump");
}

function updateComboDisplay() {
    const comboEl = document.getElementById("combo");
    comboEl.innerText = "Combo: x" + combo.toFixed(1);
    comboEl.classList.remove("combo-bump");
    void comboEl.offsetWidth;
    comboEl.classList.add("combo-bump");
}

function showNearMiss(points) {
    const el = document.getElementById("nearMiss");
    el.innerText = "YAKIN GEÇİŞ +" + points;
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "nearMissAnimation .8s ease forwards";
}

/* =========================================================
   CONTROLS 
========================================================= */
function moveLeft() { if(!isGameOver && currentSpeed > 0) currentLane = Math.max(0, currentLane - 1); }
function moveRight() { if(!isGameOver && currentSpeed > 0) currentLane = Math.min(laneCount - 1, currentLane + 1); }
function pressGas() { if(!isGameOver) isAccelerating = true; }
function releaseGas() { isAccelerating = false; }
function pressBrake() { if(!isGameOver) isBraking = true; }
function releaseBrake() { isBraking = false; }
function pressNitro() { if(!isGameOver) isNitro = true; }
function releaseNitro() { isNitro = false; }

window.addEventListener("keydown", e => {
    if (isGameOver) return;
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") moveLeft();
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") moveRight();
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") pressGas();
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") pressBrake();
    else if (e.key === " ") pressNitro();
    else if (e.key === "v" || e.key === "V") isFirstPerson = !isFirstPerson;
});
window.addEventListener("keyup", e => {
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") releaseGas();
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") releaseBrake();
    if (e.key === " ") releaseNitro();
});

const btnL = document.getElementById('btn-left');
const btnR = document.getElementById('btn-right');
const btnG = document.getElementById('btn-gas');
const btnB = document.getElementById('btn-brake');
const btnN = document.getElementById('btn-nitro');

const preventDef = (e) => { e.preventDefault(); e.stopPropagation(); };

[btnL, btnR, btnG, btnB, btnN].forEach(btn => {
    btn.addEventListener('contextmenu', preventDef); 
});

btnL.addEventListener('touchstart', (e)=>{ preventDef(e); moveLeft(); }, {passive:false});
btnR.addEventListener('touchstart', (e)=>{ preventDef(e); moveRight(); }, {passive:false});

btnG.addEventListener('touchstart', (e)=>{ preventDef(e); pressGas(); }, {passive:false});
btnG.addEventListener('touchend', (e)=>{ preventDef(e); releaseGas(); }, {passive:false});
btnG.addEventListener('touchcancel', (e)=>{ preventDef(e); releaseGas(); }, {passive:false});

btnB.addEventListener('touchstart', (e)=>{ preventDef(e); pressBrake(); }, {passive:false});
btnB.addEventListener('touchend', (e)=>{ preventDef(e); releaseBrake(); }, {passive:false});
btnB.addEventListener('touchcancel', (e)=>{ preventDef(e); releaseBrake(); }, {passive:false});

btnN.addEventListener('touchstart', (e)=>{ preventDef(e); pressNitro(); }, {passive:false});
btnN.addEventListener('touchend', (e)=>{ preventDef(e); releaseNitro(); }, {passive:false});
btnN.addEventListener('touchcancel', (e)=>{ preventDef(e); releaseNitro(); }, {passive:false});

/* =========================================================
   CRASH (PATLAMA EFEKTI)
========================================================= */
function crash() {
    if (isGameOver) return;
    isGameOver = true;

    const flash = document.getElementById('crash-flash');
    flash.style.opacity = 0.9;
    setTimeout(() => { flash.style.opacity = 0; }, 300);

    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("endlessHighScore", bestScore);
    }

    document.getElementById("gameover-score").innerHTML =
        `Final Skor: ${score}<br>
         Mesafe: ${distance.toFixed(2)} km<br>
         ${score >= bestScore ? "🎉 YENİ REKOR! 🎉" : ""}`;

    document.getElementById("gameover").style.display = "block";
}

/* =========================================================
   ANIMATION LOOP
========================================================= */
let lastTime = performance.now();

function animate(currentTime) {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    const delta = Math.min((currentTime - lastTime) / 16.67, 2.5);
    lastTime = currentTime;

    /* =================================================
       YUMUŞATILMIŞ FİZİK MOTORU 
    ================================================= */
    if (isNitro && nitro > 0) {
        nitro -= .4 * delta;
        currentSpeed += .012 * delta; 
        
        playerExhausts.forEach(ex => {
            ex.visible = true;
            ex.scale.z = 1.8 + Math.random() * 1.5;
            ex.material.color.setHex(Math.random() > 0.5 ? 0x00ffff : 0xff00ff);
        });
    } else {
        playerExhausts.forEach(ex => ex.visible = false);
        if (isAccelerating) {
            currentSpeed += accelerationRate * delta; // Yumuşak hızlanma
        } else {
            currentSpeed -= friction * delta; // Tatlı yavaşlama
        }
    }

    if (isBraking) {
        currentSpeed -= brakingPower * delta; // Yumuşatılmış ama güçlü fren
        playerTaillightMat.color.setHex(0xff0000);
        playerTaillightMat.emissive.setHex(0xff0000);
        playerTaillightMat.emissiveIntensity = 4.0; 
    } else {
        playerTaillightMat.color.setHex(0x770000);
        playerTaillightMat.emissive.setHex(0x330000);
        playerTaillightMat.emissiveIntensity = 1.0;
    }

    currentSpeed = Math.max(0, Math.min(currentSpeed, maxSpeed * (isNitro ? 1.3 : 1)));

    if (!isNitro) nitro += .05 * delta;
    nitro = Math.max(0, Math.min(100, nitro));
    document.getElementById("nitro-bar").style.width = nitro + "%";

    /* SPEED HUD & FOV */
    const displaySpeed = Math.floor(currentSpeed * 65);
    document.getElementById("speed-val").innerText = displaySpeed;
    const speedBonus = displaySpeed > 180;
    document.getElementById("multiplier").style.display = speedBonus ? "block" : "none";

    let targetFov = 65;
    if (speedBonus) targetFov += (displaySpeed - 180) * .05;
    if (isNitro) targetFov += 15;
    if (currentSpeed < 1) targetFov = 60; 
    camera.fov += (targetFov - camera.fov) * .08;
    camera.updateProjectionMatrix();

    /* PLAYER STEERING */
    const targetX = lanes[currentLane];
    const diffX = targetX - playerCar.position.x;
    
    if(currentSpeed > 0.1) {
        steeringVelocity += diffX * .05;
        steeringVelocity *= .80;
        playerCar.position.x += steeringVelocity * delta;
        playerCar.position.x += diffX * .04;

        playerCar.rotation.z = -diffX * .08;
        playerCar.rotation.y = -steeringVelocity * .4;
        if (steeringWheel) steeringWheel.rotation.z = -diffX * 2.0;
        
        playerFrontWheels.forEach(wheel => {
            wheel.rotation.y = THREE.MathUtils.clamp(-diffX * .5, -.4, .4);
        });
    } else {
        playerCar.rotation.z *= 0.85;
        playerCar.rotation.y *= 0.85;
    }

    /* WORLD MOVEMENT */
    const worldSpeed = currentSpeed * delta;

    lines.forEach(line => {
        line.position.z += worldSpeed;
        if (line.position.z > 25) line.position.z -= 540;
    });

    const positions = speedParticles.geometry.attributes.position.array;
    for (let i = 2; i < particleCount * 3; i += 3) {
        positions[i] += worldSpeed * 2.5;
        if (positions[i] > 20) positions[i] -= 320;
    }
    speedParticles.geometry.attributes.position.needsUpdate = true;

    warpLines.children.forEach(m => {
        m.position.z += worldSpeed * 4;
        m.scale.z = Math.max(1, currentSpeed * 2); 
        if(m.position.z > 50) m.position.z -= 450;
    });

    /* TREES & HOUSES MOVEMENT */
    for (let i = trees.length - 1; i >= 0; i--) {
        const tree = trees[i];
        tree.position.z += worldSpeed;
        if (tree.position.z > 30) { scene.remove(tree); trees.splice(i, 1); }
    }
    if (currentSpeed > 0.1 && Math.random() < .05 * currentSpeed) spawnTree(-350);

    for (let i = houses.length - 1; i >= 0; i--) {
        const house = houses[i];
        house.position.z += worldSpeed;
        if (house.position.z > 50) { scene.remove(house); houses.splice(i, 1); }
    }
    if (currentSpeed > 0.1 && Math.random() < .01 * currentSpeed) spawnHouse(-450); 

    /* DISTANCE & COMBO */
    distance += currentSpeed * .00008 * delta;
    document.getElementById("distance").innerText = "Mesafe: " + distance.toFixed(2) + " km";

    comboTimer -= delta;
    if (comboTimer <= 0 && combo > 1.0) {
        combo = Math.max(1, combo - .01 * delta);
        updateComboDisplay();
    }

    /* COINS */
    for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        coin.position.z += worldSpeed;
        coin.rotation.z += .15 * delta;

        const dz = Math.abs(playerCar.position.z - coin.position.z);
        const dx = Math.abs(playerCar.position.x - coin.position.x);

        if (dz < 2.5 && dx < 1.5) {
            scene.remove(coin); coins.splice(i, 1);
            let earned = speedBonus ? 100 : 50;
            score += Math.floor(earned * combo);
            combo += .3; comboTimer = 180;
            updateScoreDisplay(); updateComboDisplay();
        } else if (coin.position.z > 30) {
            scene.remove(coin); coins.splice(i, 1);
        }
    }

    /* =================================================
       YENİ FİZİK: GÖRECELİ TRAFİK HAREKETİ 
    ================================================= */
    for (let i = trafficCars.length - 1; i >= 0; i--) {
        const traffic = trafficCars[i];
        const car = traffic.mesh;

        traffic.absSpeed += (traffic.targetSpeed - traffic.absSpeed) * 0.02 * delta;
        const trafficRelativeSpeed = currentSpeed - traffic.absSpeed;
        car.position.z += trafficRelativeSpeed * delta;

        traffic.changeTimer -= delta;
        if (traffic.changeTimer <= 0) {
            traffic.changeTimer = 150 + Math.random() * 250;
            if (Math.random() < .45) {
                const possible = [];
                if (traffic.lane > 0) possible.push(traffic.lane - 1);
                if (traffic.lane < laneCount - 1) possible.push(traffic.lane + 1);
                if (possible.length) {
                    traffic.targetLane = possible[Math.floor(Math.random() * possible.length)];
                    traffic.targetSpeed = getAbsoluteSpeedForLane(traffic.targetLane); 
                }
            }
        }

        const desiredX = lanes[traffic.targetLane];
        car.position.x += (desiredX - car.position.x) * .03 * delta;
        car.rotation.z = (desiredX - car.position.x) * -.05;
        traffic.lane = traffic.targetLane;

        const dz = Math.abs(playerCar.position.z - car.position.z);
        const dx = Math.abs(playerCar.position.x - car.position.x);

        if (dz < 3.4 && dx < 1.65) crash();
        else if (dz < 3 && dx < 3 && dx > 1.65 && !traffic.passedNear) {
            if(currentSpeed > traffic.absSpeed) {
                traffic.passedNear = true; 
                let points = Math.floor(50 * combo);
                score += points;
                combo += .5; 
                comboTimer = 220;
                showNearMiss(points);
                updateScoreDisplay();
                updateComboDisplay(); 
            }
        }

        if (car.position.z > 30 || car.position.z < -600) {
            scene.remove(car);
            trafficCars.splice(i, 1);
            if(car.position.z > 30) score += Math.floor(15 * combo); 
            updateScoreDisplay();
        }
    }

    /* DEER (YENİ: GEYİK SIKLIĞI ARTIRILDI) */
    deerTimer -= delta;
    if (deerTimer <= 0) {
        if (Math.random() < .02) { // Geyik ihtimali artırıldı
            spawnDeer();
            deerTimer = 150 + Math.random() * 300; // Süre kısaltıldı
        }
    }

    for (let i = deerList.length - 1; i >= 0; i--) {
        const deerData = deerList[i];
        const deer = deerData.mesh;

        deer.position.x += deerData.direction * deerData.speed * delta;
        deer.position.z += worldSpeed; 
        deerData.phase += .35 * delta;
        deer.rotation.z = Math.sin(deerData.phase) * .06;

        const dz = Math.abs(playerCar.position.z - deer.position.z);
        const dx = Math.abs(playerCar.position.x - deer.position.x);

        if (dz < 2.5 && dx < 1.7) crash();

        if (deer.position.z > 30 || Math.abs(deer.position.x) > 40) {
            scene.remove(deer);
            deerList.splice(i, 1);
        }
    }

    /* TRAFFIC SPAWN (YENİ: ÇOK DAHA YOĞUN ARAÇ SPWANI) */
    spawnTimer += delta;
    const difficulty = Math.min(1, distance / 10);
    // Limit oldukça düşürüldü -> Araçlar çok hızlı dolar
    const spawnLimit = Math.max(5, 25 - currentSpeed * 5 - difficulty * 10);

    if (spawnTimer > spawnLimit && trafficCars.length < 45) { // Max araç kapasitesi artırıldı
        spawnTrafficCar();
        spawnTimer = 0;
    }

    /* CAMERA SHAKE & POSITION */
    let shakeX = 0, shakeY = 0;
    if (currentSpeed > 1) { 
        if (speedBonus || isNitro) {
            shakeX = (Math.random() - .5) * (isNitro ? .15 : .05);
            shakeY = (Math.random() - .5) * (isNitro ? .12 : .04);
        }
    }

    if (isFirstPerson) {
        playerCar.userData.cabin.visible = false;
        camera.position.x = playerCar.position.x - .4;
        camera.position.y = 1.12 + shakeY;
        camera.position.z = playerCar.position.z - .15;
        camera.lookAt(playerCar.position.x - .4, 1.05, playerCar.position.z - 70);
    } else {
        playerCar.userData.cabin.visible = true;
        const targetCamX = playerCar.position.x;
        camera.position.x += (targetCamX - camera.position.x) * .1;
        
        const targetCamZ = playerCar.position.z + 11 + currentSpeed * 1.8;
        camera.position.z += (targetCamZ - camera.position.z) * .1;
        
        camera.position.y = 4.4 + shakeY;
        camera.position.x += shakeX;
        
        camera.lookAt(playerCar.position.x, .4, playerCar.position.z - 40);
    }

    renderer.render(scene, camera);
}

/* =========================================================
   RESIZE & START
========================================================= */
window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

for (let i = 0; i < 15; i++) {
    setTimeout(spawnTrafficCar, i * 200); 
}

camera.position.set(lanes[3], 4.5, 14);
currentSpeed = 0; 
animate(performance.now());

</script>
